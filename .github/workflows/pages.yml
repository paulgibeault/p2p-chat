# Thin caller for the fleet CI/CD standard. The pipeline lives in the
# launcher repo (fleet-ci.yml); change it there and every app follows.
# See GAME_INTEGRATION.md §13a.
name: CI & Deploy Pages

on:
  push:
    # master is this repo's default branch today; main is listed so the
    # trigger survives the rename to main without another edit.
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # version_bump pushes the bump commit back to main
  pages: write
  id-token: write

# Per-ref, so a PR run never cancels main's deploy.
#
# Cancelling is for PRs ONLY. A main run cancelled mid-deploy can have already
# pushed the version bump without publishing it, leaving the origin serving a
# version that no longer matches the repo — the exact drift the bump exists
# to prevent. Pushes to main queue and drain instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fleet:
    uses: paulgibeault/paulgibeault.github.io/.github/workflows/fleet-ci.yml@main
    with:
      # The fleet norm for any app with a service worker: CI owns the cache
      # version (§10).
      version_bump: true
      # Publish the game's offline pack so the launcher can run it with no network.
      offline_pack: true
